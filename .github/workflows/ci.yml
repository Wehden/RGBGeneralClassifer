name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
  AWS_EC2_METADATA_DISABLED: 'true'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
jobs:
  workflow:
    name: Workflow correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax, expressions and shell commands
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  unit:
    name: Unit / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            image: python:3.12-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b
          - python: '3.13'
            image: python:3.13-slim-bookworm@sha256:281d39ff02e3b389401586134ff9e6572954687822a58055ec07a60ded4e0b7f
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install base service and unit dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Catch syntax and undefined-name errors
        run: |
          python -m compileall -q board rgb common scripts training ci
          ruff check --select E9,F63,F7,F82 board rgb common scripts training ci tests
      - name: Run full suite with statement and branch coverage
        run: |
          mkdir -p ci-results
          python -m pytest -q --cov --cov-report=term --cov-report=xml:ci-results/coverage.xml --cov-report=json:ci-results/coverage.json --cov-report=html --junitxml=ci-results/unit.xml
          python scripts/check-coverage.py ci-results/coverage.json
      - name: Publish coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('ci-results/coverage.json')
          if path.exists():
              data = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('Statement + branch coverage: **%.2f%%**\n' % data['totals']['percent_covered'])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-python-${{ matrix.python }}
          path: ci-results/
          retention-days: 14

  browser:
    name: Browser / real local service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install service and Chromium
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Check all shipped JavaScript and behavior tests
        run: |
          for source in rgb/static/*.js ci/*.cjs tests/js/*.cjs; do node --check "$source"; done
          node --test tests/js/*.test.cjs
      - name: Exercise stream recovery and full RGB / RGB-D console
        run: |
          npm run test:browser
          npm run test:console
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-synthetic-evidence
          path: ci-results/
          retention-days: 14

  local-runtime:
    name: Local runtime / models, camera SDK and X11 / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-local.txt
            requirements-desktop.txt
            requirements-test.txt
            requirements-artifacts.txt
      - name: Install production local / desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libopengl0 libglib2.0-0 libusb-1.0-0 libnss3 libsnappy1v5 libminizip1t64 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          python -m pip install -r requirements-desktop.txt -r requirements-artifacts.txt -r requirements-test.txt
          python -m pip check
      - name: Qualify native Ubuntu package and offline user setup
        run: |
          umask 077
          python scripts/build-ubuntu-package.py --version 0.0.1 --bundle-wheels --output-dir "$RUNNER_TEMP/rgb-packages"
          package="$RUNNER_TEMP/rgb-packages/bolt-rgb_0.0.1_${{ matrix.arch }}.deb"
          dpkg-deb --raw-extract "$package" "$RUNNER_TEMP/rgb-extracted"
          export BOLT_RGB_RUNTIME_DIR="$RUNNER_TEMP/rgb-installer-runtime"
          launcher="$RUNNER_TEMP/rgb-extracted/opt/bolt-rgb/launcher.py"
          python "$launcher" setup --offline
          python "$launcher" service --help
          python "$launcher" desktop --help
          mkdir -p ci-results
          cp "$package.sha256" ci-results/installer.sha256
          dpkg-deb --field "$package" > ci-results/installer-control.txt
      - name: Qualify actual ONNX / OpenVINO, material inference and SDK initialization
        run: |
          mkdir -p ci-results
          python -m pytest -q ci/test_model_runtimes.py --cov --cov-report=xml:ci-results/runtime-coverage.xml --junitxml=ci-results/runtime.xml
          python -m rgb.local --help
          python -m rgb.desktop --help
      - name: Render and shut down the actual X11 Qt / WebEngine console
        # A regular hosted runner user preserves Chromium's production sandbox.
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, PySide6
          plugin = Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so'
          linked = subprocess.check_output(['ldd', str(plugin)], text=True)
          assert 'not found' not in linked, linked
          PY
          timeout 60s xvfb-run -a python ci/qt_console_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: local-runtime-${{ matrix.arch }}-reports
          path: ci-results/
          retention-days: 14

  training:
    name: Training / CPU export qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.12-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CPU trainer / exporter dependencies
        run: |
          python -m pip install -r requirements-training-ci.txt
          python -m pip check
      - name: Train tiny SigLIP, export and load through the console classifier
        run: |
          mkdir -p ci-results
          python -m pytest -q ci/test_training_runtime.py tests/test_material_training.py tests/test_material_calibration.py tests/test_material_weighting.py --cov=training/materials --cov=rgb.materials --cov-report=xml:ci-results/training-coverage.xml --junitxml=ci-results/training.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: training-cpu-reports
          path: ci-results/
          retention-days: 14

  containers:
    name: Deployment containers / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native service and board deployment images
        run: |
          docker build -t rgb-classifier:ci .
          docker build -f board/Dockerfile -t rgb-board-base:ci .
          docker build -f board/Dockerfile.yoloe --build-arg BASE_IMAGE=rgb-board-base:ci -t rgb-board-yoloe:ci .
          docker run --rm --network none --entrypoint python rgb-classifier:ci -m pip check
          docker run --rm --network none --entrypoint python rgb-board-yoloe:ci -m pip check
      - name: Qualify private service startup, real Redis, restart and board inference
        run: python3 scripts/ci-container-smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deployment-${{ matrix.arch }}-reports
          path: ci-results/
          retention-days: 14

  test:
    # Keep the existing required-check name; every lane must succeed.
    name: test
    if: always()
    needs: [workflow, unit, browser, local-runtime, training, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all qualification lanes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          assert not failures, failures
          print('Every CI qualification lane passed.')
          PY
