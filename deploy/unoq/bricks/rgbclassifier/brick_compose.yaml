services:
  detector:
    image: rgb-classifier:unoq-portable-materials-20261026-v2
    restart: unless-stopped
    environment:
      DETECTOR_BACKEND: yoloe
      YOLOE_MODEL: /app/models/yoloe-26n-pf-320/model.onnx
      YOLOE_MANIFEST: /app/models/yoloe-26n-pf-320/manifest.json
      MAX_FPS: '0'
    user: '1000:1000'
    group_add: ['44']
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    ports: ['8080:8080']
    env_file: /home/arduino/rgb-classifier/runtime.env
    volumes: ['/home/arduino/rgb-classifier/data:/data']
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
